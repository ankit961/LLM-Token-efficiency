name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Core: stdlib-only path (no tree-sitter). Proves Python ast + fallback mode.
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Tests (fallback mode — no tree-sitter grammars)
        run: python -m pytest -q

  # Codegraph: with tree-sitter grammars installed (high-confidence JS/TS/…).
  codegraph:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,codegraph]"
      - name: Tests (tree-sitter available)
        run: python -m pytest -q
      - name: Adapter availability
        run: python -c "from contextruntime.codegraph.registry import available_adapters; print(available_adapters())"
